# YOLOv8-BCM: Blueberry Color-Maturity YOLO (完整改进: C2f_CA + BiFPN_Concat + P2)
# 说明:
#   - 骨干: 深层 C2f 替换为 C2f_CA(坐标注意力), 浅层保留 C2f 控制算力
#   - 颈部: PAN 的 Concat 替换为 BiFPN_Concat(可学习加权融合)
#   - 检测: 新增 P2 高分辨率检测层(stride 4), 共 4 尺度 [P2,P3,P4,P5]
# 消融变体: yolov8n-ca.yaml / yolov8n-bifpn.yaml / yolov8n-p2.yaml / yolov8n.yaml
nc: 3  # 由 dataset/data.yaml 覆盖
scales:
  n: [0.33, 0.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 6, C2f_CA, [256, True]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 6, C2f_CA, [512, True]]     # 6
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 3, C2f_CA, [1024, True]]    # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 10
  - [[-1, 6], 1, BiFPN_Concat, [512]]             # 11
  - [-1, 3, C2f_CA, [512, False]]                 # 12 (P4/16)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 13
  - [[-1, 4], 1, BiFPN_Concat, [256]]             # 14
  - [-1, 3, C2f_CA, [256, False]]                 # 15 (P3/8)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 16
  - [[-1, 2], 1, BiFPN_Concat, [128]]             # 17
  - [-1, 3, C2f_CA, [128, False]]                 # 18 (P2/4)
  - [-1, 1, Conv, [128, 3, 2]]                    # 19
  - [[-1, 15], 1, BiFPN_Concat, [256]]            # 20
  - [-1, 3, C2f_CA, [256, False]]                 # 21 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]                    # 22
  - [[-1, 12], 1, BiFPN_Concat, [512]]            # 23
  - [-1, 3, C2f_CA, [512, False]]                 # 24 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                    # 25
  - [[-1, 9], 1, BiFPN_Concat, [1024]]            # 26
  - [-1, 3, C2f_CA, [1024, False]]                # 27 (P5/32)
  - [[18, 21, 24, 27], 1, Detect, [nc]]           # 28
