# YOLOv8-BCM-Lite: P2 + BiFPN_Concat + WIoU (不含 C2f-CA)
# 用于验证: 移除负贡献组件后, 组合改进是否稳定优于基线。
nc: 2
scales:
  n: [0.33, 0.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, BiFPN_Concat, [512]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, BiFPN_Concat, [256]]
  - [-1, 3, C2f, [256, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, BiFPN_Concat, [128]]
  - [-1, 3, C2f, [128, False]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, BiFPN_Concat, [256]]
  - [-1, 3, C2f, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, BiFPN_Concat, [512]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, BiFPN_Concat, [1024]]
  - [-1, 3, C2f, [1024, False]]
  - [[18, 21, 24, 27], 1, Detect, [nc]]
